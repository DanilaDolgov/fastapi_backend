<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Бронирование — LUXE</title>
  <style>
    :root{
      --card-bg:#fff;
      --muted:#6b7280;
      --accent:#0f62fe;
      --container-w:1000px;
    }
    body{
      font-family:Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
      background:#f3f4f6;
      margin:20px;
      color:#111827;
      -webkit-font-smoothing:antialiased;
    }
    .wrap{
      max-width:var(--container-w);
      margin:0 auto;
      background:var(--card-bg);
      border-radius:12px;
      padding:20px;
      box-shadow:0 6px 24px rgba(15,23,42,0.08);
      display:flex;
      gap:20px;
      flex-wrap:wrap;
    }
    .left{
      flex:1 1 520px;
      min-width:280px;
    }
    .title{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      flex-wrap:wrap;
      gap:12px;
    }
    .title h1{margin:0;font-size:22px;}
    .hotel{color:var(--muted);font-size:14px;}
    .info-box{
      background:#f9fafb;
      border-radius:10px;
      padding:14px;
      margin-top:14px;
    }
    .info-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin:8px 0;
    }
    .label{color:var(--muted);font-size:13px;min-width:140px;}
    .value{font-weight:600;font-size:14px;}
    .price{font-size:18px;font-weight:700;color:#0b1220;}

    /* правая колонка */
    .right{
      width:420px;
      min-width:280px;
    }

    /* Автоформатирование фото */
    .slider{
      position:relative;
      border-radius:10px;
      overflow:hidden;
      display:grid;
      aspect-ratio:4/3;
      background:#e5e7eb;
    }
    .slider img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      opacity:0;
      transform:scale(1.05);
      transition:opacity .6s ease,transform 1s ease;
      grid-area:1/1;
    }
    .slider img.active{
      opacity:1;
      transform:scale(1);
      z-index:2;
    }

    .slider-buttons{
      position:absolute;
      top:50%;
      left:0;
      right:0;
      display:flex;
      justify-content:space-between;
      transform:translateY(-50%);
      padding:0 8px;
      pointer-events:none;
    }
    .slider-buttons button{
      pointer-events:all;
      background:rgba(0,0,0,0.45);
      border:none;
      color:#fff;
      width:36px;
      height:36px;
      border-radius:6px;
      cursor:pointer;
      font-size:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:background .3s;
    }
    .slider-buttons button:hover{
      background:rgba(0,0,0,0.6);
    }

    .dots{
      display:flex;
      gap:8px;
      justify-content:center;
      margin-top:8px;
    }
    .dot{
      width:10px;
      height:10px;
      background:#cbd5e1;
      border-radius:50%;
      cursor:pointer;
      transition:background .3s;
    }
    .dot.active{background:var(--accent);}

    .facilities{
      margin-top:12px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-start;
    }
    .facility{
      display:flex;
      gap:8px;
      align-items:center;
      background:var(--accent);
      color:#fff;
      padding:6px 10px;
      border-radius:8px;
      font-size:13px;
    }
    .facility svg{width:16px;height:16px;fill:#fff;}

    @media(max-width:980px){
      .wrap{padding:14px;}
      .right{width:100%;order:2;}
      .left{order:1;width:100%;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <div class="title">
        <div>
          <h1>LUXE — номер</h1>
          <div class="hotel">Отель: Sochi · ул. Лазурная дом 1</div>
        </div>
        <div class="price">10&nbsp;000 ₽</div>
      </div>

      <div class="info-box">
        <div class="info-row">
          <div class="label">Описание:</div>
          <div class="value">string</div>
        </div>

        <h3 style="margin:6px 0 8px 0;">Данные пользователя</h3>
        <div class="info-row">
          <div class="label">Email:</div>
          <div class="value">user@example.com</div>
        </div>

        <h3 style="margin:6px 0 8px 0;">Данные размещения</h3>
        <div class="info-row">
          <div class="label">Название номера:</div>
          <div class="value">LUXE</div>
        </div>
        <div class="info-row">
          <div class="label">Дата заселения:</div>
          <div class="value">2025-10-05</div>
        </div>
        <div class="info-row">
          <div class="label">Дата выезда:</div>
          <div class="value">2025-10-05</div>
        </div>
      </div>
    </div>

    <div class="right">
      <div class="slider" id="slider">
        <img src="http://localhost:9000/test/rooms/23/1%20%283%29%20%283%29.png?response-content-disposition=inline&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=minioadmin%2F20251005%2Fus-west-2%2Fs3%2Faws4_request&X-Amz-Date=20251005T201901Z&X-Amz-Expires=3600&X-Amz-SignedHeaders=host&X-Amz-Signature=f9bc9376b1737efb42d1cf19254214eda1a1999c5d857f5e620044a63df197ab" class="active">
        <img src="http://localhost:9000/test/rooms/23/ChatGPT%20Image%2027%20%D0%B8%D1%8E%D0%BB.%202025%20%D0%B3.%2C%2011_04_53%20%283%29%20%282%29.png?response-content-disposition=inline&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=minioadmin%2F20251005%2Fus-west-2%2Fs3%2Faws4_request&X-Amz-Date=20251005T201901Z&X-Amz-Expires=3600&X-Amz-SignedHeaders=host&X-Amz-Signature=c718b640021d49c793390c43054b9dbe814d5d5690c701ff9bd2a81ae5167dc0">
        <div class="slider-buttons">
          <button id="prev">&lt;</button>
          <button id="next">&gt;</button>
        </div>
      </div>

      <div class="dots" id="dots">
        <div class="dot active" data-index="0"></div>
        <div class="dot" data-index="1"></div>
      </div>

      <div class="facilities">
        <div class="facility">
          <svg viewBox="0 0 24 24"><path d="M12 2C10.343 2 9 3.343 9 5s1.343 3 3 3 3-1.343 3-3-1.343-3-3-3zm0 4c-.552 0-1-.448-1-1s.448-1 1-1 1 .448 1 1-.448 1-1 1zM4 20v-2c0-2.21 1.79-4 4-4h8c2.21 0 4 1.79 4 4v2H4z"/></svg>
          SPA
        </div>
        <div class="facility">
          <svg viewBox="0 0 24 24"><path d="M12 18c.828 0 1.5.672 1.5 1.5S12.828 21 12 21s-1.5-.672-1.5-1.5S11.172 18 12 18zm6-3.535a9.959 9.959 0 0 0-12 0c-.39.39-.39 1.024 0 1.414s1.024.39 1.414 0a7.959 7.959 0 0 1 9.172 0c.39.39 1.024.39 1.414 0s.39-1.024 0-1.414zm-3-3a5.978 5.978 0 0 0-6 0c-.39.39-.39 1.024 0 1.414s1.024.39 1.414 0a3.978 3.978 0 0 1 3.172 0c.39.39 1.024.39 1.414 0s.39-1.024 0-1.414z"/></svg>
          WiFi
        </div>
        <div class="facility">
          <svg viewBox="0 0 24 24"><path d="M21 19a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1c0-2.67 5.33-4 9-4s9 1.33 9 4zm-9-2c-3.33 0-7 .67-7 2h14c0-1.33-3.67-2-7-2zm0-9a4 4 0 0 1 4 4H8a4 4 0 0 1 4-4z"/></svg>
          Swimming pool
        </div>
      </div>
    </div>
  </div>

  <script>
    // простой автослайдер
    (function(){
      const imgs = Array.from(document.querySelectorAll('#slider img'));
      const dots = Array.from(document.querySelectorAll('#dots .dot'));
      const prev = document.getElementById('prev');
      const next = document.getElementById('next');
      let i = 0;
      let timer;

      function show(n){
        imgs.forEach((img,j)=>img.classList.toggle('active',j===n));
        dots.forEach((d,j)=>d.classList.toggle('active',j===n));
        i = n;
      }

      function nextSlide(){ show((i+1)%imgs.length); }
      function prevSlide(){ show((i-1+imgs.length)%imgs.length); }

      next.onclick = ()=>{ nextSlide(); reset(); };
      prev.onclick = ()=>{ prevSlide(); reset(); };
      dots.forEach((d,idx)=>d.onclick=()=>{show(idx);reset();});

      function start(){ timer=setInterval(nextSlide,5000); }
      function reset(){ clearInterval(timer); start(); }
      start();
    })();
  </script>
</body>
</html>
