<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Курс доллара</title>
</head>
<body>
  <h1>Курс доллара (USD/RUB)</h1>
  <div id="rate">Загрузка...</div>

  <script>
    // ws:// если ты запускаешь через http://
    const ws = new WebSocket(`ws://${window.location.host}/many/ws/usd`);

    ws.onopen = () => console.log('WebSocket открыт');

    ws.onmessage = e => {
      document.getElementById('rate').textContent = e.data;
    };

    ws.onclose = () => {
      document.getElementById('rate').textContent = 'Соединение закрыто';
    };

    ws.onerror = err => {
      console.error('Ошибка WebSocket', err);
    };
  </script>
</body>
</html>
