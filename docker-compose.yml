services:
  web-backend:
    build: .
    container_name: web-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/src/src
      - ./logs:/logs
      - ./config:/config
    command: >
      bash -c "alembic upgrade head &&
      uvicorn src.main:app --host 0.0.0.0 --port 8000
      --log-config /config/logging_config.yaml"
    depends_on:
      - redis
      - db
      - minio
    networks:
      - booking_network
    dns:
      - 8.8.8.8
      - 1.1.1.1

  celery_beat:
    build: .
    container_name: celery_beat
    command: celery -A src.tasks.celery_app.celery_instance beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - db
    networks:
      - booking_network
    dns:
      - 8.8.8.8
      - 1.1.1.1

  celery_worker:
    build: .
    container_name: celery_worker
    command: celery -A src.tasks.celery_app.celery_instance worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - db
    networks:
      - booking_network
    dns:
      - 8.8.8.8
      - 1.1.1.1

  db:
    image: postgres:alpine
    container_name: booking-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - booking_network

  minio:
    container_name: minio
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    command: ["server", "--console-address", ":9001", "/data"]
    volumes:
      - ./minio_data:/data
    networks:
      - booking_network

  redis:
    image: redis:7-alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    networks:
      - booking_network

  nginx:
    image: nginx:latest
    container_name: booking-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web-backend
    networks:
      - booking_network

networks:
  booking_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
